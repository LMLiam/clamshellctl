name: Bug report
description: Report incorrect or unexpected clamshellctl behaviour.
title: "bug(area): "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, private keys,
        complete environment dumps, or unrelated system information.
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.4"
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: "MacBook Pro (Apple M3)"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Homebrew
        - Companion-app DMG
        - Source checkout
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: clamshellctl version
      description: Paste the output of `clamshellctl --version`.
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Current status
      description: Paste the output of `clamshellctl status` when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include concise reproduction steps and safe error output.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed passwords, tokens, private keys, and unrelated personal data.
          required: true
