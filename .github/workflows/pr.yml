name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-conventional-subject.sh "$PR_TITLE"

  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          validator="$RUNNER_TEMP/check-conventional-subject.sh"
          git show "$BASE_SHA:scripts/check-conventional-subject.sh" > "$validator"
          chmod +x "$validator"
          while IFS= read -r subject; do
            "$validator" "$subject"
          done < <(git log --format=%s "$BASE_SHA..HEAD")
