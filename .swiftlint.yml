strict: true
check_for_updates: false
allow_zero_lintable_files: false

excluded:
  - .build
  - .swiftpm
  - Clamshell.xcodeproj
  - DerivedData

disabled_rules:
  - closing_brace
  - colon
  - comma
  - leading_whitespace
  - line_length
  - opening_brace
  - function_name_whitespace
  - return_arrow_whitespace
  - statement_position
  - force_try
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - vertical_whitespace

opt_in_rules:
  - array_init
  - closure_body_length
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - legacy_multiple
  - modifier_order
  - overridden_super_call
  - pattern_matching_keywords
  - reduce_into
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function

closure_body_length:
  warning: 40
  error: 60
cyclomatic_complexity:
  warning: 10
  error: 15
file_length:
  warning: 400
  error: 500
  ignore_comment_only_lines: true
function_body_length:
  warning: 40
  error: 60
function_parameter_count:
  warning: 6
  error: 8
type_body_length:
  warning: 250
  error: 350

reporter: xcode
